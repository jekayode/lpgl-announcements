name: Deploy to cPanel

# Every push to main uploads the site to your cPanel folder via FTP.
# No manual file uploads needed — just edit, commit, and push.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # If your FTP account is scoped to public_html/gl/updates, leave this as "./".
          # If it logs in at public_html, change it to "gl/updates/".
          server-dir: ./
          # Don't upload repo/dev files to the live site.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README.md
            **/optimize.py
